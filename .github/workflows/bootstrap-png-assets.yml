name: Bootstrap PNG assets

on:
  push:
    branches:
      - remediation/issue-16-pilot-assets
    paths:
      - scripts/generate_assets.py
      - requirements-assets.txt
      - skills/architecture-council/assets/source/**
      - skills/architecture-council/assets/icon.svg
      - .github/workflows/bootstrap-png-assets.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out asset branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: remediation/issue-16-pilot-assets

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install visual asset dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-assets.txt

      - name: Generate PNG publication assets
        run: python scripts/generate_assets.py

      - name: Commit generated PNGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/architecture-council/assets/*.png
          if git diff --cached --quiet; then
            echo "No generated asset changes"
            exit 0
          fi
          git commit -m "Generate PNG publication assets"
          git push origin HEAD:${GITHUB_REF_NAME}
