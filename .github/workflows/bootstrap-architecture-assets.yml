name: Bootstrap Architecture Council PNG assets

on:
  push:
    branches:
      - remediation/issue-16-architecture-council-assets
    paths:
      - ".github/workflows/bootstrap-architecture-assets.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-architecture-council-assets
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remediation/issue-16-architecture-council-assets
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-assets.txt

      - name: Generate lossless PNG publication assets
        run: python scripts/generate_assets.py

      - name: Validate exact changed-path allowlist and publish automation branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            "skills/architecture-council/assets/icon.png"
            "skills/architecture-council/assets/hero-council-3d.png"
            "skills/architecture-council/assets/review-panel-3d.png"
            "skills/architecture-council/assets/decision-flow-3d.png"
            "skills/architecture-council/assets/evidence-model-3d.png"
            "skills/architecture-council/assets/outcome-loop-3d.png"
            "skills/architecture-council/assets/social-preview.png"
          )

          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No generated asset changes."
            exit 0
          fi

          for path in "${changed[@]}"; do
            ok=false
            for approved in "${allowed[@]}"; do
              if [ "$path" = "$approved" ]; then ok=true; break; fi
            done
            if [ "$ok" != true ]; then
              echo "::error::Unexpected changed path: $path"
              exit 1
            fi
          done

          git add -- "${allowed[@]}"
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -ne 7 ]; then
            echo "::error::Expected exactly 7 generated PNGs, got ${#staged[@]}"
            exit 1
          fi

          automation_branch="automation/issue-16-architecture-assets-${GITHUB_RUN_ID}"
          git switch -c "$automation_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Architecture Council PNG publication assets"

          gh auth setup-git
          git push origin "HEAD:refs/heads/$automation_branch"
