name: Validate ChatGPT Skill

on:
  push:
    branches: [main, develop]
    paths:
      - "skills/architecture-council/**"
      - "scripts/build-chatgpt-skill.py"
      - "scripts/validate-repository.py"
      - "CHATGPT.md"
      - ".github/workflows/validate-chatgpt-skill.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "skills/architecture-council/**"
      - "scripts/build-chatgpt-skill.py"
      - "scripts/validate-repository.py"
      - "CHATGPT.md"
      - ".github/workflows/validate-chatgpt-skill.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate repository
        run: python scripts/validate-repository.py
      - name: Validate and package native ChatGPT Skill
        run: python scripts/build-chatgpt-skill.py
      - name: Upload distributable Skill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-council-chatgpt-skill
          path: dist/skill.zip
          if-no-files-found: error
