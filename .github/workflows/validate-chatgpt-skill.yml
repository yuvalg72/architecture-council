name: Validate ChatGPT Skill

on:
  push:
    branches: [main, develop]
    paths:
      - "skills/architecture-council/**"
      - "scripts/build-chatgpt-skill.py"
      - "scripts/validate-repository.py"
      - "CHATGPT.md"
      - ".github/workflows/validate-chatgpt-skill.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "skills/architecture-council/**"
      - "scripts/build-chatgpt-skill.py"
      - "scripts/validate-repository.py"
      - "CHATGPT.md"
      - ".github/workflows/validate-chatgpt-skill.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate repository
        run: python scripts/validate-repository.py
      - name: Validate and package native ChatGPT Skill
        run: python scripts/build-chatgpt-skill.py
      - name: Upload distributable Skill
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: architecture-council-chatgpt-skill
          path: dist/skill.zip
          if-no-files-found: error
