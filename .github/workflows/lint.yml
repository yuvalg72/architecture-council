name: Repository Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Markdown linter
        run: npm install -g markdownlint-cli
      - name: Markdown lint
        run: |
          markdownlint --config .markdownlint.json \
            README.md CONTRIBUTING.md CHANGELOG.md CHATGPT.md SECURITY.md \
            ".github/**/*.md" \
            "docs/**/*.md" \
            "skills/architecture-council/**/*.md"
      - name: Run repository contract tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate repository
        run: python scripts/validate-repository.py
      - name: Validate and package Skill
        run: python scripts/build-chatgpt-skill.py
