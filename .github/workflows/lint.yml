name: Repository Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install Markdown linter
        run: npm install -g markdownlint-cli
      - name: Markdown lint
        run: |
          markdownlint --config .markdownlint.json \
            README.md CONTRIBUTING.md CHANGELOG.md CHATGPT.md SECURITY.md \
            ".github/**/*.md" \
            "docs/**/*.md" \
            "skills/architecture-council/**/*.md"
      - name: Run repository contract tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate repository
        run: python scripts/validate-repository.py
      - name: Validate and package Skill
        run: python scripts/build-chatgpt-skill.py
