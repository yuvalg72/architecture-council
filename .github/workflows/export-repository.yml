name: Export repository snapshot

on:
  push:
    branches:
      - agent/architecture-council-v1.0.1

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create repository snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.')
          output = Path('repository-snapshot.zip')
          excluded = {'.git', 'repository-snapshot.zip'}
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  if any(part in excluded for part in path.parts):
                      continue
                  archive.write(path, path.as_posix())
          PY

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: architecture-council-repository-snapshot
          path: repository-snapshot.zip
          if-no-files-found: error
