name: Export repository snapshot

on:
  push:
    branches:
      - agent/architecture-council-v1.0.1

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create repository snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('repository-snapshot.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('.').rglob('*')):
                  if path.is_file() and '.git' not in path.parts and path.name != 'repository-snapshot.zip':
                      archive.write(path, path.as_posix())
          PY
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: architecture-council-repository-snapshot
          path: repository-snapshot.zip
          if-no-files-found: error
