<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Council 3D decision chamber</title>
  <desc id="desc">A premium isometric council chamber with six professional reviewer pods, a raised independent chairman, and a central decision core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.58" stop-color="#0B1630"/>
      <stop offset="1" stop-color="#111A38"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="48%">
      <stop offset="0" stop-color="#65E6FF" stop-opacity="0.26"/>
      <stop offset="0.52" stop-color="#8A7CFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B6F5FF"/>
      <stop offset="0.45" stop-color="#65E6FF"/>
      <stop offset="1" stop-color="#8A7CFF"/>
    </linearGradient>
    <linearGradient id="coreLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42C6E9"/>
      <stop offset="1" stop-color="#136C8E"/>
    </linearGradient>
    <linearGradient id="coreRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7569F4"/>
      <stop offset="1" stop-color="#342D8B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECF8FF" stop-opacity="0.78"/>
      <stop offset="0.35" stop-color="#7FD5FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8A7CFF" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="podFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3050"/>
      <stop offset="1" stop-color="#0D1A2D"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE5A4"/>
      <stop offset="1" stop-color="#F7C873"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse" patternTransform="skewX(-30) scale(1 .56)">
      <path d="M54 0H0V54" fill="none" stroke="#7FD5FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="28" fill="url(#halo)"/>
  <path d="M0 686 L800 430 L1600 686 L1600 900 L0 900 Z" fill="url(#grid)" opacity="0.82"/>
  <path d="M0 688 L800 432 L1600 688" fill="none" stroke="#65E6FF" stroke-opacity="0.10" stroke-width="2"/>

  <g opacity="0.46">
    <circle cx="800" cy="520" r="258" fill="none" stroke="#65E6FF" stroke-width="1.5" stroke-dasharray="6 14"/>
    <circle cx="800" cy="520" r="204" fill="none" stroke="#8A7CFF" stroke-width="1" stroke-dasharray="3 13"/>
  </g>

  <g stroke-linecap="round" fill="none">
    <path d="M800 510 L800 220" stroke="#F7C873" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M800 520 L472 408" stroke="#65E6FF" stroke-opacity="0.38" stroke-width="3"/>
    <path d="M800 520 L1128 408" stroke="#65E6FF" stroke-opacity="0.38" stroke-width="3"/>
    <path d="M800 520 L410 594" stroke="#8A7CFF" stroke-opacity="0.34" stroke-width="3"/>
    <path d="M800 520 L1190 594" stroke="#8A7CFF" stroke-opacity="0.34" stroke-width="3"/>
    <path d="M800 520 L585 720" stroke="#54E0B4" stroke-opacity="0.34" stroke-width="3"/>
    <path d="M800 520 L1015 720" stroke="#54E0B4" stroke-opacity="0.34" stroke-width="3"/>
  </g>

  <g>
    <g transform="translate(800 520)">
      <ellipse cx="0" cy="112" rx="150" ry="52" fill="#020711" opacity="0.52"/>
      <polygon points="-116,-20 0,-82 116,-20 0,44" fill="url(#coreTop)"/>
      <polygon points="-116,-20 0,44 0,156 -116,92" fill="url(#coreLeft)"/>
      <polygon points="116,-20 0,44 0,156 116,92" fill="url(#coreRight)"/>
      <polygon points="-70,-10 0,-48 70,-10 0,28" fill="#07111F" opacity="0.64"/>
      <circle cx="0" cy="-8" r="31" fill="#F4FDFF" filter="url(#softGlow)"/>
      <circle cx="0" cy="-8" r="17" fill="#65E6FF"/>
      <text x="0" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#EAFBFF">DECISION CORE</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#EAFBFF" text-anchor="middle">
    <g transform="translate(472 408)">
      <ellipse cx="0" cy="52" rx="104" ry="34" fill="#020711" opacity="0.46"/>
      <polygon points="-82,-34 0,-74 82,-34 0,8" fill="url(#glass)" stroke="#65E6FF" stroke-opacity="0.55"/>
      <polygon points="-82,-34 0,8 0,72 -82,30" fill="url(#podFront)"/>
      <polygon points="82,-34 0,8 0,72 82,30" fill="#14243E"/>
      <circle cx="0" cy="-30" r="13" fill="#65E6FF"/>
      <text x="0" y="106" font-size="18">STRATEGY</text>
    </g>
    <g transform="translate(1128 408)">
      <ellipse cx="0" cy="52" rx="104" ry="34" fill="#020711" opacity="0.46"/>
      <polygon points="-82,-34 0,-74 82,-34 0,8" fill="url(#glass)" stroke="#8A7CFF" stroke-opacity="0.62"/>
      <polygon points="-82,-34 0,8 0,72 -82,30" fill="url(#podFront)"/>
      <polygon points="82,-34 0,8 0,72 82,30" fill="#14243E"/>
      <circle cx="0" cy="-30" r="13" fill="#8A7CFF"/>
      <text x="0" y="106" font-size="18">TECHNOLOGY</text>
    </g>
    <g transform="translate(410 594)">
      <ellipse cx="0" cy="52" rx="104" ry="34" fill="#020711" opacity="0.46"/>
      <polygon points="-82,-34 0,-74 82,-34 0,8" fill="url(#glass)" stroke="#54E0B4" stroke-opacity="0.58"/>
      <polygon points="-82,-34 0,8 0,72 -82,30" fill="url(#podFront)"/>
      <polygon points="82,-34 0,8 0,72 82,30" fill="#14243E"/>
      <circle cx="0" cy="-30" r="13" fill="#54E0B4"/>
      <text x="0" y="106" font-size="18">DELIVERY</text>
    </g>
    <g transform="translate(1190 594)">
      <ellipse cx="0" cy="52" rx="104" ry="34" fill="#020711" opacity="0.46"/>
      <polygon points="-82,-34 0,-74 82,-34 0,8" fill="url(#glass)" stroke="#F7C873" stroke-opacity="0.60"/>
      <polygon points="-82,-34 0,8 0,72 -82,30" fill="url(#podFront)"/>
      <polygon points="82,-34 0,8 0,72 82,30" fill="#14243E"/>
      <circle cx="0" cy="-30" r="13" fill="#F7C873"/>
      <text x="0" y="106" font-size="18">GOVERNANCE</text>
    </g>
    <g transform="translate(585 720)">
      <ellipse cx="0" cy="52" rx="104" ry="34" fill="#020711" opacity="0.46"/>
      <polygon points="-82,-34 0,-74 82,-34 0,8" fill="url(#glass)" stroke="#FF7AB6" stroke-opacity="0.58"/>
      <polygon points="-82,-34 0,8 0,72 -82,30" fill="url(#podFront)"/>
      <polygon points="82,-34 0,8 0,72 82,30" fill="#14243E"/>
      <circle cx="0" cy="-30" r="13" fill="#FF7AB6"/>
      <text x="0" y="106" font-size="18">OPERATIONS</text>
    </g>
    <g transform="translate(1015 720)">
      <ellipse cx="0" cy="52" rx="104" ry="34" fill="#020711" opacity="0.46"/>
      <polygon points="-82,-34 0,-74 82,-34 0,8" fill="url(#glass)" stroke="#65E6FF" stroke-opacity="0.58"/>
      <polygon points="-82,-34 0,8 0,72 -82,30" fill="url(#podFront)"/>
      <polygon points="82,-34 0,8 0,72 82,30" fill="#14243E"/>
      <circle cx="0" cy="-30" r="13" fill="#65E6FF"/>
      <text x="0" y="106" font-size="18">STAKEHOLDERS</text>
    </g>
  </g>

  <g transform="translate(800 205)" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <ellipse cx="0" cy="80" rx="118" ry="38" fill="#020711" opacity="0.50"/>
    <polygon points="-92,-20 0,-66 92,-20 0,28" fill="url(#chair)"/>
    <polygon points="-92,-20 0,28 0,92 -92,44" fill="#9B6A22"/>
    <polygon points="92,-20 0,28 0,92 92,44" fill="#6D4D20"/>
    <path d="M0 -42 L11 -18 L38 -15 L18 3 L24 31 L0 17 L-24 31 L-18 3 L-38 -15 L-11 -18 Z" fill="#FFF8D9"/>
    <text x="0" y="126" font-size="18" font-weight="700" letter-spacing="2.2" fill="#FFE9B4">INDEPENDENT CHAIRMAN</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#EAFBFF">
    <text x="78" y="92" font-size="54" font-weight="800" letter-spacing="1.2">Architecture Council</text>
    <text x="82" y="138" font-size="23" font-weight="500" fill="#AFC3D9">Structured dissent. Weighted decisions. Observable kill criteria.</text>
    <text x="1518" y="84" text-anchor="end" font-size="15" font-weight="700" letter-spacing="3" fill="#65E6FF">NATIVE CHATGPT SKILL</text>
  </g>
</svg>
